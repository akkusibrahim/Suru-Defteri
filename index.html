<style>
/* Layout: tek sütun, telefon öncelikli. Altta sabit gezinme, formlar alttan açılan sayfa.
   Küpe numaraları gerçek küpe gibi sarı etiket olarak gösterilir. */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --surface2:#E7EDE8; --fg:#17231D; --muted:#58695F; --line:#D3DDD6;
  --accent:#1D6A51; --accent-fg:#FFFFFF; --accent-soft:#D9EADF;
  --warn:#935500; --warn-soft:#FAE9C6; --bad:#B3261E; --bad-soft:#F8DDDA;
  --tag:#F2C230; --tag-fg:#2A2100;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --surface:#18201C; --surface2:#212B26; --fg:#E6EEE9; --muted:#9AAAA1; --line:#2B3731;
    --accent:#5CC49E; --accent-fg:#06241A; --accent-soft:#1F3A30;
    --warn:#F0B44C; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#40201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201C; --surface2:#212B26; --fg:#E6EEE9; --muted:#9AAAA1; --line:#2B3731;
  --accent:#5CC49E; --accent-fg:#06241A; --accent-soft:#1F3A30;
  --warn:#F0B44C; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#40201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.5 var(--body); -webkit-text-size-adjust:100%;
  padding-block:8px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:720px;margin:0 auto}
a{color:inherit}
h1,h2,h3{margin:0}
h2{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
h3{font:600 15px/1.2 var(--body);margin-bottom:10px}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 0 6px}
.top h1{font:600 28px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.top .date{color:var(--muted);font-size:13px;text-align:right}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.avatar svg{width:58%;height:58%}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mgrid>div{display:grid;gap:2px;min-width:0}
.mgrid b{font:600 20px/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.gain{color:var(--accent)} .loss{color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-block:1px solid var(--line)}
.stats>div{padding:12px 4px;text-align:center;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font:600 34px/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}

.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font:600 15px/1 var(--body);padding:13px 16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:10px 13px;font-size:14px;min-height:40px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.empty{text-align:center;padding:40px 8px}
.empty p{margin:8px 0 18px;color:var(--muted)}

.eartag{display:inline-flex;align-items:center;gap:6px;background:var(--tag);color:var(--tag-fg);font:600 14px/1 var(--display);letter-spacing:.05em;padding:3px 8px 3px 6px;border-radius:6px;white-space:nowrap}
.eartag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

.ev{display:flex;gap:14px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none}
.evn{width:64px;text-align:center;flex:none;font-family:var(--display)}
.evn b{display:block;font-size:30px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.evn small{font-size:12px;color:var(--muted);font-family:var(--body)}
.evn.warn b{color:var(--warn)} .evn.bad b{color:var(--bad)}
.evb{min-width:0}
.evt{font-weight:600}
.evs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}

.pg{display:block;text-decoration:none;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.pg .l1,.pg .l2{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pg .l2{font-size:13px;color:var(--muted);margin-top:8px}
.track{height:8px;background:var(--surface2);border-radius:99px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.chips button{font:600 13px/1 var(--body);padding:9px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.acard{display:flex;gap:12px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-decoration:none}
.avatar{width:68px;height:68px;border-radius:12px;background:var(--surface2);color:var(--muted);display:grid;place-items:center;font:600 24px/1 var(--display);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.big{width:84px;height:84px;border-radius:16px;font-size:34px;border:0;cursor:pointer;padding:0}
.abody{min-width:0;display:grid;gap:5px}
.aname{font-weight:600;font-size:16px}
.arow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ameta{font-size:13px;color:var(--muted)}

.dhead{display:flex;gap:14px;align-items:center}
.dhead h2{font:600 26px/1.05 var(--display);letter-spacing:.02em;text-transform:none;color:var(--fg);margin:0 0 6px}
.pbig{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pbig .d b{font:600 44px/1 var(--display);font-variant-numeric:tabular-nums}
.pbig .d span{color:var(--muted)}
.pbig .r{text-align:right;display:grid;gap:2px}
.pbig .r b{font-size:16px}
.pbig .r b.bad{color:var(--bad)}
.pbig .r span{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.list>.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.list>.li:first-child{border-top:0}
.li .a{min-width:0}.li .a b{display:block}.li .a small{color:var(--muted)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.hd h3{margin:0}

.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gt{fill:var(--muted);font:9px var(--body)}
.chart .bar{fill:var(--accent);opacity:.5}
.chart .bar.last{opacity:1}

.mrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mhead{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.mrow .who{min-width:0;display:grid;gap:4px}
.mrow input{text-align:center;padding:10px 6px}
.dnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.dnav input{flex:1;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.total b{font:600 40px/1 var(--display);font-variant-numeric:tabular-nums}

.grid-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.grid-ph button{padding:0;border:0;background:var(--surface2);border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:pointer}
.grid-ph img{width:100%;height:100%;object-fit:cover;display:block}
.bigph{width:100%;max-height:50vh;object-fit:contain;border-radius:12px;background:var(--surface2)}

.big-cost{font:600 46px/1 var(--display);font-variant-numeric:tabular-nums}

input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#nav .in{display:flex;gap:4px;width:100%;max-width:720px}
#nav a{flex:1;min-width:0;display:grid;justify-items:center;gap:3px;text-align:center;padding:8px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12.5px;font-weight:600}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav svg{width:24px;height:24px}
.svgi svg{width:1em;height:1em;display:block}.si .em.svgi{font-size:22px}
.sum .sumi .em.svgi{font-size:38px}.sums.five .sumi .em.svgi{font-size:40px}#nav .em.svgi{font-size:26px}
.chips.sg{margin:6px 0 0;flex-wrap:wrap;overflow:visible}.chips.sg button{padding:7px 11px;font-weight:500}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal;font-weight:400;line-height:1;display:inline-block}
#nav .em{font-size:22px}
.tile .ti .em{font-size:24px}
.sum .sumi .em{font-size:22px}
.si .em{font-size:17px}
.avatar .head{display:block;width:78%;height:78%}.avatar .head svg{width:100%;height:100%;display:block}
.avatar .em{font-size:36px}
.avatar.big .em{font-size:46px}
.eartag.none{background:var(--surface2);color:var(--muted)}
.eartag.none::before{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;align-items:center;gap:12px;padding:12px;min-height:68px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px/1.2 var(--body);text-align:left;text-decoration:none;cursor:pointer;min-width:0}
.tile .ti{flex:none;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .ti svg{width:24px;height:24px}
.sums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sums.five{grid-template-columns:repeat(5,1fr)}
.sum{display:grid;justify-items:center;gap:2px;padding:10px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;cursor:pointer;min-width:0;font:inherit}
.sum .sumi{color:var(--accent);display:grid}
.sum .sumi svg{width:22px;height:22px}.sum .sumi .svgi svg{width:1em;height:1em}.svgi svg{stroke:none;filter:drop-shadow(0 0 .6px rgba(40,40,40,.65))}.sum .sumi{min-height:40px;align-content:center;justify-items:center}
.sum b{font:600 26px/1 var(--display);font-variant-numeric:tabular-nums}
.sum .sl{font-size:12px;color:var(--muted);text-align:center}
.sline{font-size:13.5px;font-weight:600;color:var(--muted)}
.sline.ok{color:var(--accent)} .sline.warn{color:var(--warn)} .sline.bad{color:var(--bad)}
.sicons{margin-left:auto;display:grid;grid-template-columns:repeat(2,30px);gap:6px;flex:none;align-self:center}
.si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.si svg{width:18px;height:18px}
.si.ok{background:var(--accent-soft);color:var(--accent)} .si.warn{background:var(--warn-soft);color:var(--warn)} .si.bad{background:var(--bad-soft);color:var(--bad)}
.legend{margin-top:14px;font-size:14px}
.legend summary{cursor:pointer;color:var(--muted);font-weight:600}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.lgi{display:flex;align-items:center;gap:8px;font-size:13px}
.evd{font-size:13px;color:var(--muted);margin-top:2px}
.li.tl{gap:10px;justify-content:flex-start}
.tl .a{flex:1}
.tdate{width:46px;flex:none;text-align:center;font-family:var(--display)}
.tdate b{display:block;font-size:24px;line-height:1;font-weight:600}
.tdate small{font:12px var(--body);color:var(--muted)}
.ticon{flex:none;color:var(--muted);display:grid}
.ticon svg{width:20px;height:20px}
.rrow{display:grid;grid-template-columns:24px 1fr auto 56px;gap:4px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.ri{color:var(--accent);display:grid}.ri svg{width:20px;height:20px}
.rrow .pct{text-align:right;font-size:13px}
.rbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
#nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}

[hidden]{display:none!important}
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet-body{position:relative;width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;display:grid;gap:12px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-body h2{font:600 22px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--fg);margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:min(92vw,420px)}
@media (prefers-reduced-motion:no-preference){.sheet-body{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}

  if(!b) return '';

  if(+t.slice(8)<+b.slice(8)) m--;

  else{state[col]=state[col].filter(function(x){return x.id!==id});lsSave();render(true)}

var queues={};
function enq(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(function(e){toast(errText(e))});return queues[key]}

function startSync(){
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(s){
      state[c]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      got[c]=true; if(!s.metadata.fromCache) synced[c]=true;
      if(Object.keys(got).length===COLS.length) loading=false;
      if(Object.keys(synced).length===COLS.length) staleNote=false;
      render();
    },function(e){loading=false;toast(errText(e));render()});
  });
  setTimeout(function(){
    if(Object.keys(synced).length<COLS.length){loading=false;staleNote=true;render()}
  },10000);
}
function watchPhotos(id){
  if(photoFor===id) return;

  photoFor=id;
  if(!db||!id){if(db)state.photos=[];return}
  photoUnsub=db.collection('photos').where('animalId','==',id).onSnapshot(function(s){
    state.photos=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
    render();
  },function(){});
}

function idx(){
  MI=new Map(); DT=new Map();
  state.milk.forEach(function(m){
    MI.set(m.id,m);
    DT.set(m.date,(DT.get(m.date)||0)+(m.am||0)+(m.pm||0));
  });
}
function series(days,aid){
  var t=today(),out=[];
  for(var i=days-1;i>=0;i--){
    var d=addDays(t,-i),v=null;
    if(aid){var m=MI.get(aid+'_'+d);if(m)v=(m.am||0)+(m.pm||0)}
    else if(DT.has(d)) v=DT.get(d);
    out.push({d:d,v:v});
  }
  return out;
}
function avgOf(ser){var v=ser.filter(function(x){return x.v!=null});return v.length?sum(v,function(x){return x.v})/v.length:null}
function lastBirth(id){
  var d=state.births.filter(function(b){return b.animalId===id&&b.outcome!=='iptal'}).map(function(b){return b.date});
  var a=byId(id); if(a&&a.calved) d.push(a.calved);
  d.sort(); return d.length?d[d.length-1]:null;
}
function preg(a){
  if(a.exitDate||!canBreed(a)) return null;
  var lb=lastBirth(a.id);
  var l=state.ins.filter(function(i){return i.animalId===a.id&&(!lb||i.date>lb)}).sort(function(x,y){return y.date.localeCompare(x.date)});
  var i=l[0]; if(!i||i.result==='bos') return null;
  var g=(a.gest>0)?a.gest:GEST, t=today(), exp=addDays(i.date,g);
  return {ins:i,gest:g,day:diff(t,i.date),exp:exp,left:diff(exp,t),dry:addDays(exp,-DRY),check:addDays(i.date,30),heat:addDays(i.date,CYCLE),confirmed:i.result==='gebe'};
}
function lastHeat(a){
  var lb=lastBirth(a.id), l=state.heats.filter(function(h){return h.animalId===a.id&&(!lb||h.date>lb)}).map(function(h){return h.date}).sort();
  return l.length?l[l.length-1]:null;
}
/* Açık (gebe olmayan) hayvan için bir sonraki beklenen kızgınlık: son kızgınlık ya da son tohumlamadan 21 gün sonra */
function nextHeat(a){
  if(a.exitDate||!canBreed(a)||preg(a)) return null;
  var lb=lastBirth(a.id), base=lastHeat(a);
  state.ins.forEach(function(i){if(i.animalId===a.id&&(!lb||i.date>lb)&&(!base||i.date>base))base=i.date});
  return base?addDays(base,CYCLE):null;
}
function withdrawal(a,on){
  if(a.exitDate&&(!on||on>a.exitDate)) return null;
  var t=on||today(),best=null;
  state.health.forEach(function(h){
    if(h.animalId!==a.id||!(h.wd>0)||h.date>t) return;
    var until=addDays(h.date,h.wd);
    if(until>=t&&(!best||until>best.until)) best={until:until,left:diff(until,t),what:h.note||h.type};
  });
  return best;
}
/* ---------- rasyon ve stok ---------- */
var norm=function(s){return String(s||'').trim().toLocaleLowerCase('tr')};
var hash=function(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h).toString(36)};
function settings(){var s=state.meta.find(function(x){return x.id==='settings'});return {targetDays:(s&&s.targetDays)||30}}
function rationFor(a){
  var own=state.rations.filter(function(r){return r.scope==='animal'&&r.key===a.id});
  if(own.length) return {own:true,items:own};
  return {own:false,items:state.rations.filter(function(r){return r.scope==='status'&&r.key===a.status})};
}
function itemNeed(x,L){
  var tot=(x.kg||0)+(x.perL||0)*L, mx=(x.mix||[]).filter(function(c){return c&&c.item&&c.pct>0}), s=sum(mx,function(c){return c.pct});
  if(mx.length&&s>0) return {item:x.item,kg:tot,mix:true,parts:mx.map(function(c){return {item:c.item,kg:tot*c.pct/s,pct:Math.round(c.pct/s*100)}})};
  return {item:x.item,kg:tot,mix:false,parts:[{item:x.item,kg:tot}]};
}
function animalNeedItems(a){var r=rationFor(a), L=avgOf(series(7,a.id))||0;return r.items.map(function(x){return itemNeed(x,L)})}
function animalNeed(a){
  var out=[];animalNeedItems(a).forEach(function(n){n.parts.forEach(function(p){out.push({item:p.item,kg:p.kg})})});
  return out;
}
function herdNeed(){
  var m={};
  state.animals.filter(active).forEach(function(a){
    animalNeed(a).forEach(function(x){var k=norm(x.item);(m[k]||(m[k]={item:x.item,kg:0})).kg+=x.kg});
  });
  return m;
}
function lastPrice(item){
  var k=norm(item), c=state.stock.concat(state.feed).filter(function(x){return norm(x.item)===k&&x.price}).sort(function(a,b){return b.date.localeCompare(a.date)});
  return c.length?c[0].price:null;
}
function stockTable(){
  var need=herdNeed(), m={}, first={};
  Object.keys(need).forEach(function(k){m[k]={item:need[k].item,need:need[k].kg,stock:0}});
  state.stock.forEach(function(x){
    var k=norm(x.item); (m[k]||(m[k]={item:x.item,need:0,stock:0})).stock+=x.kg||0;
    if(!first[k]||x.date<first[k]) first[k]=x.date;
  });
  state.feed.forEach(function(x){var k=norm(x.item);if(m[k]&&first[k]&&x.date>=first[k])m[k].stock-=x.kg||0});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.item.localeCompare(b.item,'tr')});
}
function buildEvents(){
  var t=today(),ev=[];
  state.animals.forEach(function(a){
    var p=preg(a);
    if(p){
      ev.push({d:p.exp,a:a,kind:'birth',title:p.confirmed?'Doğum bekleniyor':'Tahmini doğum'});
      if(!p.confirmed){
        ev.push({d:p.check,a:a,kind:'check',title:'Gebelik kontrolü'});
        ev.push({d:p.heat,a:a,kind:'heat',title:'Tekrar kızgınlık gözle'});
      }
      if(a.status!=='Kuru') ev.push({d:p.dry,a:a,kind:'dry',title:'Kuruya çıkar'});
    }
    if(active(a)&&a.status==='Buzağı'&&a.birth) ev.push({d:addDays(a.birth,180),a:a,kind:'grow',title:'Buzağı 6 aylık oldu, durumunu güncelle'});
    var w=withdrawal(a);
    if(w) ev.push({d:w.until,a:a,kind:'wd',title:'Süt bekleme süresi bitiyor'});
    var nh=nextHeat(a);
    if(nh) ev.push({d:nh,a:a,kind:'heat2',title:'Kızgınlık beklenen gün'});
    var lb2=lastBirth(a.id);
    if(active(a)&&a.status==='Sağmal'&&!p&&lb2&&!(nh&&diff(nh,t)>=-2)&&!state.ins.some(function(i){return i.animalId===a.id&&i.date>lb2}))
      ev.push({d:addDays(lb2,PPW),a:a,kind:'open',title:'Tohumlama zamanı'});
    if(active(a)) state.health.forEach(function(x){if(x.animalId===a.id&&x.next) ev.push({d:x.next,a:a,kind:'health',title:(x.type||'Sağlık')+' hatırlatması',desc:x.note||''})});
  });
  var win={birth:[-20,45],check:[-30,14],heat:[-2,7],heat2:[-2,7],open:[-45,14],grow:[-730,14],dry:[-20,30],wd:[0,30],health:[-7,30]};
  return ev.map(function(e){e.left=diff(e.d,t);return e})
    .filter(function(e){var w=win[e.kind];return e.left>=w[0]&&e.left<=w[1]})
    .map(function(e){e.tone=(e.left<0&&e.kind!=='heat'&&e.kind!=='heat2'&&e.kind!=='grow')?'bad':e.left<=7?'warn':'';return e})
    .sort(function(x,y){return x.left-y.left});
}

function mdur(n){n=Math.abs(n);if(n<30)return n+' gün';var t=today(),s=new Date((n>=0?t:t)+'T00:00:00'),e=new Date(addDays(t,n)+'T00:00:00'),m=(e.getFullYear()-s.getFullYear())*12+e.getMonth()-s.getMonth(),x=new Date(s);x.setMonth(s.getMonth()+m);if(x>e){m--;x=new Date(s);x.setMonth(s.getMonth()+m)}var d=Math.round((e-x)/864e5);return m+' ay'+(d?' '+d+' gün':'')}
function pregChip(a){
  var p=preg(a); if(!p) return '';
  return p.confirmed?(p.left<0?chip('Doğum gecikti','bad'):chip('Doğuma '+mdur(p.left),'ok')):chip('Gebelik kontrolü bekliyor','warn');
}
function niceMax(x){var p=Math.pow(10,Math.floor(Math.log10(x)));var m=[1,1.2,1.5,2,2.5,3,4,5,6,8,10];for(var i=0;i<m.length;i++){if(m[i]*p>=x)return m[i]*p}return 10*p}
function chart(ser,label){
  var vals=ser.map(function(s){return s.v||0}), mx=niceMax(Math.max.apply(null,vals.concat([1])));
  var W=320,H=124,L=32,B=18,T=8,R=4,pw=W-L-R,ph=H-T-B,n=ser.length,bw=pw/n,g='',last=-1;
  ser.forEach(function(s,i){if(s.v)last=i});
  [0,.5,1].forEach(function(f){var y=T+ph*(1-f);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end" class="gt">'+fmtN(mx*f)+'</text>'});
  ser.forEach(function(s,i){
    if(!s.v) return;
    var h=ph*s.v/mx;
    g+='<rect x="'+(L+i*bw+bw*.16).toFixed(1)+'" y="'+(T+ph-h).toFixed(1)+'" width="'+(bw*.68).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5" class="bar'+(i===last?' last':'')+'"/>';
  });
  g+='<text x="'+L+'" y="'+(H-4)+'" class="gt">'+dshort(ser[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end" class="gt">'+dshort(ser[n-1].d)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(label)+'">'+g+'</svg>';
}

function statusLine(a){
  if(a.exitDate) return {t:(a.exitType||'Sürüden çıktı')+' · '+dshort(a.exitDate),tone:'bad'};
  var t=today(), p=preg(a), w=withdrawal(a);
  if(w) return {t:'Süt verilmez, '+w.left+' gün kaldı',tone:'bad'};
  if(p){
    if(p.confirmed){
      if(p.left<0) return {t:'('+p.day+'. gün) Hesaplanan doğum zamanı '+(-p.left)+' gün geçti, veterinerinize danışın',tone:'bad'};
      if(a.status==='Sağmal'&&diff(p.dry,t)<=0) return {t:'Kuruya çıkarma zamanı geldi',tone:'warn'};
      if(p.left<=14) return {t:'('+p.day+'. gün) Doğum yaklaşıyor: '+mdur(p.left)+' kaldı',tone:'warn'};
      return {t:'Doğuma kalan tahmini süre: '+mdur(p.left),tone:'ok'};
    }
    if(p.day>60) return {t:'Tohumlanalı '+mdur(p.day)+' oldu, sonuç girilmemiş. Gebe mi, boş mu?',tone:'warn'};
    if(p.day>=30) return {t:'('+mdur(p.day)+') Gebelik kontrolü yapılabilir',tone:'warn'};
    var hd=diff(p.heat,t);
    if(hd>=-2&&hd<=3) return {t:'Kızgınlık belirtilerini kontrol edin',tone:'warn'};
    return {t:'Tohumlandı · '+p.day+'. gün',tone:''};
  }
  var nh=nextHeat(a);
  if(nh&&Math.abs(diff(nh,t))<=2) return {t:'Kızgınlık bekleniyor ('+dshort(nh)+')',tone:'warn'};
  var lb=lastBirth(a.id);
  if(a.status==='Sağmal'&&lb&&diff(t,lb)>=PPW&&!state.ins.some(function(i){return i.animalId===a.id&&i.date>lb}))
    return {t:'Doğumdan '+diff(t,lb)+' gün geçti, tohumlanmadı',tone:'warn'};
  if(a.status==='Buzağı'&&a.birth&&diff(t,a.birth)>=180) return {t:'6 aylık oldu, durumunu Düve ya da Tosun yap',tone:'warn'};
  return null;
}
function statusIcons(a){
  if(a.exitDate) return [{n:'exit',l:'Sürüden çıktı',c:'bad'}];

  if(a.status==='Sağmal') o.push({n:'h:Sağmal',l:'Sağmal',c:'ok'});
  if(a.status==='Kuru') o.push({n:'dry',l:'Kuruda',c:''});
  if(p) o.push(p.confirmed?{n:'preg',l:'Gebe',c:'ok'}:{n:'syringe',l:'Tohumlu, sonuç bekleniyor',c:'warn'});
  if(isSick(a)) o.push({n:'cross',l:'Hasta, tedavide',c:'bad'});
  if(w) o.push({n:'ban',l:'Süt verilmez',c:'bad'});
  if(nh&&Math.abs(diff(nh,today()))<=2) o.push({n:'flame',l:'Kızgınlık bekleniyor',c:'warn'});

  return o.slice(0,4);
}

  h+='<div class="card"><h3>Durum kayıtları · '+dshort(from)+' – '+dshort(t)+'</h3>'+(tot?rows.map(function(r){var pc=tot?r.n/tot*100:0;return '<div class="rrow"><span class="ri">'+ic(r.i)+'</span><span>'+r.l+'</span><b>'+r.n+'</b><span class="muted pct">%'+fmtN(pc,1)+'</span><div class="rbar"><i style="width:'+pc.toFixed(1)+'%"></i></div></div>'}).join(''):'<p class="muted" style="margin:0">Bu dönemde kayıt yok.</p>')+'</div>';
  var ml=state.milk.filter(function(m){return inR(m.date)}), lit=sum(ml,function(m){return (m.am||0)+(m.pm||0)}), days=new Set(ml.map(function(m){return m.date})).size;

  var ex=state.animals.filter(function(a){return inR(a.exitDate)}), sold=ex.filter(function(a){return a.exitType==='Satıldı'}), dead=ex.filter(function(a){return a.exitType==='Öldü'});
  h+='<div class="card"><h3>Özet</h3><dl class="kv" style="margin:0"><dt>Toplam süt</dt><dd>'+fmtN(lit,0)+' L</dd><dt>Günlük ortalama</dt><dd>'+(days?fmtN(lit/days)+' L ('+days+' gün)':'—')+'</dd><dt>Doğum</dt><dd>'+live.length+' canlı'+(bs.length-live.length?', '+(bs.length-live.length)+' ölü':'')+(live.length?' ('+live.filter(function(b){return b.sex==='Dişi'}).length+' dişi, '+live.filter(function(b){return b.sex==='Erkek'}).length+' erkek)':'')+'</dd><dt>Satılan</dt><dd>'+sold.length+(sold.length&&sum(sold,function(a){return a.exitPrice||0})?' · '+fmtN(sum(sold,function(a){return a.exitPrice||0}),0)+' ₺':'')+'</dd><dt>Ölen</dt><dd>'+dead.length+'</dd></dl></div>';
  h+=moneyCard(from,t);
  h+='<div class="card"><h3>Excel dosyası olarak indir</h3><p class="muted" style="margin-top:0">CSV dosyaları Excel ile açılır.</p><div class="row-actions"><button class="btn" data-act="csvAnimals"'+(dlCap?'':' disabled')+'>Hayvan listesi</button><button class="btn" data-act="csvMilk"'+(dlCap?'':' disabled')+'>Süt kayıtları ('+(repPeriod==='ay'?'bu ay':repPeriod==='3ay'?'3 ay':'1 yıl')+')</button></div>'+(dlCap?'':'<p class="muted" style="margin-bottom:0">Bu görünümde dosya indirme kapalı.</p>')+'</div>';
  return h+viewBackup()+viewNew()+viewGuide();
}

var GUIDE=[{"t":"1. Uygulamayı açmak ve ekranı tanımak","lead":"Uygulama 5 bölümden oluşur. Hepsi ekranın en altındaki menüde durur. İstediğin bölüme parmağınla dokun.","p":["<b>Bugün</b>: Ana sayfa. Bugün ve yakında yapılacak işleri gösterir. Üstteki büyük düğmelerle hızlı kayıt girersin.","<b>Ahır</b>: Bütün hayvanların listesi. Bir hayvana dokununca kendi sayfası açılır.","<b>Süt</b>: Her gün sabah ve akşam sağılan sütü yazarsın.","<b>Yem</b>: Hangi hayvana ne kadar yem verileceği ve depodaki yem miktarı.","<b>Daha Fazla</b>: Rapor, gelir ve gider, yedek, tema ve bu kılavuz."],"tip":"Kayıt yaparken ekranın altından bir pencere açılır. Doldurup <b>Kaydet</b>'e dokunursun. Vazgeçersen <b>Vazgeç</b>'e dokun, hiçbir şey kaydedilmez. Kılavuzdaki hayvan adları (Sarıkız, Benekli...) örnektir.","img":[["bugun","Bugün sayfası"]]},{"t":"2. Yeni hayvan eklemek","lead":"Sürüdeki her hayvanı bir kez ekleyeceksin. Sonra bütün kayıtlar o hayvana bağlanır.","s":["Bugün sayfasında <b>Hayvan ekle</b>'ye dokun. (Ahır sayfasında da aynı düğme var.)","<b>Küpe no</b> yaz. Hayvanın kulağındaki numaradır. Henüz küpe takılmadıysa boş bırak, sonra eklersin.","<b>İsim</b> yaz. Küpe yoksa isim yazman gerekir.","<b>Durum</b> seç: Sağmal, Kuru, Düve, Buzağı, Tosun veya Boğa.","Doğum tarihini yaz. Annesini ve babasını (güve) listeden seç. Bilmiyorsan boş bırak.","<b>Irk</b> kutusuna dokunup listeden seç. Listede yoksa en alttaki <b>Diğer</b>'i seç ve ırkın adını yaz. Bir sonraki hayvanda bu ırk listede görünür.","<b>Kaydet</b>'e dokun."],"p":["<b>Sağmal</b> süt veren inek. <b>Kuru</b> sütü kesilmiş, doğuma hazırlanan inek. <b>Düve</b> hiç doğurmamış genç dişi. <b>Buzağı</b> yavru. <b>Tosun</b> genç erkek. <b>Boğa</b> yetişkin erkek ve baba olarak seçilebilir."],"tip":"Anne ve baba seçerken yaşı küçük olan, büyüğün ebeveyni olarak seçilemez. Doğum tarihini yazınca uygun olmayan hayvanlar listeden kalkar. Yanlış yazarsan uygulama uyarır.","img":[["ekle","Hayvan ekle penceresi, ırk için Diğer seçilmiş"]]},{"t":"3. Hayvan listesi ve simgeler","lead":"Ahır sayfasında hepsi alt alta durur. Her hayvanın yanındaki küçük simgeler durumunu bir bakışta söyler.","p":["Üstteki düğmelerle listeyi süzebilirsin: Hepsi, İnek, Sağmal, Kuru, Gebe, Düve, Buzağı, Boğa, Çıkanlar. Örneğin <b>Gebe</b>'ye dokunursan sadece gebeler kalır.","Fotoğrafı olmayan hayvanda durumuna göre bir inek başı görünür. Sağmal inek ile inek aynı başı kullanır. Süt bidonu (güğüm) ise yalnızca süt işleri içindir.","Sayfanın altındaki <b>Simgeler ne demek?</b> yazısına dokunursan hepsinin açıklaması açılır. Örnek: <b>Taze (Yeni doğuran)</b> son 21 gün içinde doğum yapmış sağmal inek demektir. <b>Süt verilmez</b> simgesi ilaç verildiğini ve süt tanka ya da satışa verilmeyeceğini gösterir."],"img":[["liste","Hayvan listesi"],["simgeler","Simgelerin açıklaması"]]},{"t":"4. Tohumlama kaydı ve doğum sayacı","lead":"İneği tohumladığında kaydet. Uygulama doğum gününü kendisi hesaplar ve geriye doğru sayar.","s":["Bugün sayfasında <b>Tohumlama</b>'ya dokun.","<b>Dişi hayvan</b>: ineği listeden seç.","<b>Tohumlama tarihi</b>: bugün seçili gelir. Başka güne yapıldıysa değiştir.","<b>Güve (baba)</b>: boğan sürüdeyse listeden seç. Pipet kullandıysan \"Sürüde yok\" seçip pipet kodunu yaz.","<b>Kaydet</b>'e dokun."],"p":["<b>Gebelik çıkınca:</b> İneğin sayfasını aç, <b>Gebe çıktı</b> düğmesine dokun. Gebe değilse <b>Boş çıktı</b>'na dokun.","Sayfada büyük bir sayı görünür. Bu gebeliğin kaçıncı günü olduğudur. Yanında \"5 ay 29 gün kaldı\" gibi doğuma kalan süre yazar. Süre ay ve gün olarak gösterilir. Bir ayı geçmiyorsa sadece gün görürsün. Bugün sayfasındaki yaklaşan olaylarda da aynı biçim vardır."],"tip":"Gebelik 280 gün sayılır. Tohumlamadan 30 gün sonra \"Gebelik kontrolü\", doğuma 60 gün kala \"Kuruya çıkar\" uyarısı Bugün sayfasına gelir. Yanlış kayıt girdiysen hayvan sayfasındaki Geçmiş listesinde kayda dokun, düzelt ya da sil.","img":[["tohum","Tohumlama penceresi"],["gebe","Gebe ineğin sayfası"]]},{"t":"5. Doğum kaydı","lead":"İnek doğurunca kaydet. Buzağı da aynı ekrandan deftere eklenir.","s":["Bugün sayfasında <b>Doğum</b>'a dokun ya da ineğin sayfasında <b>Doğum kaydet</b>'e bas.","İneği, doğum tarihini ve sonucu (diri doğdu ya da ölü) seç.","Buzağının küpe no ve ismini yaz, dişi mi erkek mi olduğunu seç.","<b>Kaydet</b>'e dokun. Buzağı Ahır listesine kendiliğinden eklenir, annesi de bağlanır."],"tip":"Doğumdan sonra inek <b>Sağmal</b> olur ve 21 gün boyunca <b>Taze</b> simgesi görürsün. Buzağı 6 aylık olunca Bugün sayfasında hatırlatma çıkar."},{"t":"6. Kızgınlık kaydı","lead":"İnek kızgınlık gösterdiğinde kaydedersen sonraki kızgınlığı uygulama hatırlatır.","s":["Bugün sayfasında <b>Kızgınlık</b>'a dokun.","İneği ve tarihi seç.","<b>Kaydet</b>'e dokun."],"p":["Kızgınlık döngüsü 21 gün sayılır. 21 gün sonrası için Bugün sayfasına hatırlatma düşer. Tohumlamayı unutmamak için işe yarar."]},{"t":"7. Günlük süt girişi","lead":"Her gün sabah ve akşam sağılan litreyi yazarsın. Uygulama ortalamayı ve toplamı kendisi bulur.","s":["Alttaki menüden <b>Süt</b>'e dokun.","Üstten günü seç (bugün hazır gelir).","Her ineğin satırına sabah ve akşam litresini yaz.","Yazdıkça kaydedilir, ayrıca bir düğmeye basman gerekmez."],"tip":"Yanlış yazdıysan aynı satıra gidip düzelt. Silmek için kutuyu boş bırak."},{"t":"8. Sağlık kaydı ve süt bekleme süresi","lead":"Hastalık, tedavi, aşı gibi şeyleri kaydedersin. İlaç verildiyse sütün ne zamana kadar verilmeyeceğini uygulama hesaplar.","s":["Hayvanın sayfasında <b>Geçmiş</b> bölümündeki <b>Sağlık ekle</b> düğmesine dokun (ya da Bugün sayfasında <b>Sağlık kaydı</b>).","Türü seç: Hastalık, Tedavi, Aşı, Muayene gibi.","Notu yaz (örnek: meme iltihabı, antibiyotik).","İlacın <b>süt bekleme süresini</b> gün olarak yaz. İlacın kutusunda yazar.","<b>Kaydet</b>'e dokun."],"tip":"Bekleme süresi bitene kadar hayvanın yanında <b>Süt verilmez</b> simgesi durur. O günlerin sütünü tanka ya da satışa karıştırma."},{"t":"9. Yem: tek yem, karma yem ve stok","lead":"Ne kadar yem vereceğini girersin. Uygulama toplam ihtiyacı ve depoda kaç gün yettiğini hesaplar.","s":["Alttaki menüden <b>Yem</b>'e dokun.","Aşağıdaki <b>Gruplara göre rasyon</b> kutularından ilgili grubun (örneğin Sağmal) <b>Kalem ekle</b> düğmesine dokun.","<b>Veriliş şekli</b>: <b>Tek yem</b> ya da <b>Karma yem</b> seç.","Tek yemde yem cinsini ve baş başına günlük kg'ı yaz. Örnek: Saman, 6 kg.","Karma yemde karışımın adını (örnek: Süt yemi) ve toplam kg'ı yaz. Sonra karışımdaki yemleri ve paylarını gir. Örnek: Arpa 50, Kepek 30, Mısır 20.","<b>Kaydet</b>'e dokun."],"p":["Örnek: Karma yem günde 10 kg ise, 50/30/20 paylarıyla 5 kg arpa, 3 kg kepek, 2 kg mısır çıkar. Stoktan her yemin payı düşülür.","Tek yem ile karma yemi aynı grupta birlikte kullanabilirsin. Örneğin bir kalem Saman (tek), bir kalem Süt yemi (karma) olabilir.","<b>Sağmal ineklerde \"süt başına ek\"</b> alanına litre başına ek yem yazarsan, son 7 günün süt ortalamasına göre kesif yem kendiliğinden ayarlanır.","<b>Stok</b> sekmesinden depoya yem girersin (kaç kg aldın, kaç liradan). Uygulama kaç gün yeteceğini söyler.","Yemlediğin zaman Rasyon sayfasındaki <b>Bugünün yemlemesini kaydet</b> düğmesine bas. Stoktan o kadar düşer."],"img":[["karma","Karma yem eklerken açılan alanlar"],["yem","Yem sayfası"]]},{"t":"10. Hayvan satıldı ya da öldü","lead":"Sürüden çıkan hayvanı silme, çıkış olarak kaydet. Geçmişi kaybolmaz.","s":["Hayvanın sayfasında <b>Sürüden çıkar</b>'a dokun.","<b>Satıldı</b> ya da <b>Öldü</b> seç, tarihini yaz.","Satıldıysa fiyatı yaz. Gelire kendiliğinden eklenir.","<b>Kaydet</b>'e dokun."],"p":["Çıkan hayvan listeden kalkar. Ahır sayfasındaki <b>Çıkanlar</b> düğmesiyle yine görebilirsin."]},{"t":"11. Hayvanın fotoğrafını eklemek","lead":"Her hayvana bir resim koyabilirsin, listede onu daha kolay tanırsın.","s":["Hayvanın sayfasını aç ve aşağıdaki <b>Fotoğraflar</b> bölümüne in.","<b>Fotoğraf ekle</b>'ye dokun.","Kameradan çek ya da galeriden seç."],"tip":"Fotoğraf yedeğe de girer."},{"t":"12. Daha Fazla: rapor, gelir-gider, yedek, tema","lead":"Bu sayfada sürünün özeti, para hesabı ve ayarlar durur.","p":["<b>Rapor</b>: Üstten <b>Bu ay, Son 3 ay, Son 1 yıl</b> seç. Kaç tohumlama, doğum, hastalık olduğunu ve toplam sütü görürsün.","<b>Gelir / gider</b>: <b>Ekle</b> düğmesiyle süt satışı, yem alımı, veteriner gibi paraları yaz. Farkı (kâr ya da zarar) kendisi gösterir. Hayvan satışı ve yem alımı ayrıca girmene gerek kalmadan hesaba katılır.","<b>Excel</b>: CSV dosyası indirirsin, Excel ile açılır.","<b>Tema</b>: Otomatik, Açık ya da Koyu seç. Seçimin bu telefonda hatırlanır.","<b>Yedek indir</b>: Bütün kayıtları ve fotoğrafları tek dosya yapar. Telefon değiştirirsen ya da bir şey kaybolursa <b>Yedekten yükle</b> ile geri getirirsin. Geri yüklerken mevcut kayıtların silinmez, yedekteki hayvanlar eklenir.","Yedek <b>yalnızca kayıtları</b> taşır, uygulamanın sürümünü taşımaz. Yeni özellikler için uygulama sayfasını yenilemen yeter."],"tip":"Haftada bir yedek almak iyi alışkanlıktır. Yedek dosyasını WhatsApp ya da e-posta ile kendine de gönderebilirsin.","img":[["fazla","Daha Fazla sayfası"]]},{"t":"13. Hızlı özet: ne yapmak istiyorsun?","lead":"Aradığın işi bul, yanındaki yola git.","p":["Yeni hayvan: <b>Bugün > Hayvan ekle</b>","İnek tohumlandı: <b>Bugün > Tohumlama</b>","İnek gebe çıktı: <b>İneğin sayfası > Gebe çıktı</b>","İnek doğurdu: <b>Bugün > Doğum</b>","İnek kızgın: <b>Bugün > Kızgınlık</b>","Süt yazmak: <b>Süt</b> sekmesi","İlaç verildi: <b>İneğin sayfası > Geçmiş > Sağlık ekle</b>","Yem miktarı ve karma yem: <b>Yem</b> sekmesi","Hayvan satıldı ya da öldü: <b>İneğin sayfası > Sürüden çıkar</b>","Gelir gider: <b>Daha Fazla</b> sayfası","Yedek, tema: <b>Daha Fazla</b> sayfasının altı"]}];

function viewBackup(){

  var th=getTheme();
  var themeCard='<div class="card"><h3>Görünüm</h3><p class="muted" style="margin-top:0">Tema seçimi bu cihazda hatırlanır.</p><div class="chips" style="margin:0">'+[['auto','Otomatik'],['light','Açık'],['dark','Koyu']].map(function(t){return '<button data-act="setTheme" data-v="'+t[0]+'" aria-pressed="'+(th===t[0])+'">'+t[1]+'</button>'}).join('')+'</div></div>';
  var wipeCard=localMode?'<div class="card"><h3>Tüm kayıtları sil</h3><p class="muted" style="margin-top:0">Bu cihazdaki bütün hayvan, süt, yem ve diğer kayıtları siler ve boş bir defterle başlarsın. Geri alınamaz, istersen önce yedek indir.</p><div class="row-actions"><button class="btn danger" data-act="wipeAll">Hepsini sil</button></div></div>':'';
  return themeCard+'<div class="card"><h3>Yedek</h3><p class="muted" style="margin-top:0">Tüm kayıtları ve fotoğrafları tek dosyada indirir. Telefon değiştirirsen ya da bir şey silinirse bu dosyadan geri yükleyebilirsin.</p><div class="row-actions"><button class="btn primary" data-act="backup"'+((dlCap||STANDALONE)?'':' disabled')+'>Yedek indir</button><button class="btn" data-act="restore">Yedekten yükle</button></div>'+((dlCap||STANDALONE)?'':'<p class="muted">Bu görünümde dosya indirme kapalı. Sayfayı claude.ai üzerinden aç.</p>')+'</div>'+
  wipeCard+'<div class="card"><h3>Saklama</h3><p class="muted" style="margin:0">'+(localMode?'Kayıtlar yalnızca bu cihazdaki tarayıcıda tutuluyor, tarayıcı verisi silinirse kaybolur. Düzenli yedek al.':'Kayıtlar bu sayfanın veri deposunda tutuluyor. Sayfa güncellense bile silinmez.')+' Şu an '+n+' kayıt var. Gebelik süresi varsayılan '+GEST+' gün (hayvan kartından hayvana göre değiştirilebilir), kuruya çıkarma doğumdan '+DRY+' gün önce, kızgınlık döngüsü '+CYCLE+' gün olarak hesaplanır.</p></div>';
}

function parseRoute(){
  var h=(location.hash||'').slice(1);
  if(h.indexOf('a-')===0) return {k:'animal',id:h.slice(2)};
  if(h==='yedek') h='rapor';
  return {k:['hayvanlar','sut','yem','rapor'].indexOf(h)>=0?h:'bugun'};
}
function isEditing(){var el=document.activeElement;return !!(el&&el.closest&&el.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))}
function render(force){
  if(!force&&isEditing()){dirty=true;return}
  dirty=false; idx();
  var r=parseRoute();
  watchPhotos(r.k==='animal'?r.id:null);
  document.querySelectorAll('#nav a').forEach(function(a){
    var on=a.dataset.r===(r.k==='animal'?'hayvanlar':r.k);
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
  var n=new Date();
  $('#today').textContent=DAYN[n.getDay()]+', '+n.getDate()+' '+MONF[n.getMonth()]+' '+n.getFullYear();
  var b='';
  if(staleNote) b+='<div class="banner">Kayıtlar henüz sunucudan doğrulanamadı. Gördüklerin eski olabilir.</div>';
  if(localMode&&!STANDALONE) b+='<div class="banner">Kalıcı depo bu görünümde kapalı. Kayıtlar yalnızca bu tarayıcıda saklanıyor.</div>';
  var body;
  if(loading) body='<p class="muted" style="margin-top:24px">Kayıtlar yükleniyor…</p>';
  else if(r.k==='animal') body=viewAnimal(r.id);
  else body={bugun:viewToday,hayvanlar:viewAnimals,sut:viewMilk,yem:viewFeed,rapor:viewReport}[r.k]();
  view.innerHTML=b+body;
}

/* ---------- form sayfası ---------- */
function fieldHtml(f){
  var id='f_'+f.name,val=f.value==null?'':f.value,c;
  if(f.type==='select'){
    c='<select id="'+id+'">'+f.options.map(function(o){o=typeof o==='string'?{v:o,l:o}:o;return '<option value="'+esc(o.v)+'"'+(o.b?' data-b="'+esc(o.b)+'"':'')+(String(o.v)===String(val)?' selected':'')+'>'+esc(o.l)+'</option>'}).join('')+'</select>';
  }else if(f.type==='textarea'){
    c='<textarea id="'+id+'" rows="2">'+esc(val)+'</textarea>';
  }else{
    c='<input id="'+id+'" type="'+(f.type==='number'?'text':(f.type||'text'))+'"'+(f.type==='number'?' inputmode="decimal"':'')+' value="'+esc(val)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+' autocomplete="off">';
    if(f.list) c+='<div class="chips sg">'+f.list.map(function(x){return '<button type="button" data-act="sugg" data-id="f_'+f.name+'" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>';
  }
  return '<div class="field"'+(f.showIf?' data-if="'+f.showIf[0]+'" data-eq="'+esc(f.showIf[1])+'"':'')+'><label for="'+id+'">'+esc(f.label)+(f.required?' *':'')+'</label>'+c+'</div>';
}
function closeSheet(){sheet.hidden=true;sheet.innerHTML='';sheetDeleteFn=null}
function openSheet(o){
  sheetDeleteFn=o.onDelete||null;
  sheet.innerHTML='<div class="sheet-bg" data-act="closeSheet"></div><form class="sheet-body" id="sheetForm" novalidate><h2>'+esc(o.title)+'</h2>'+(o.extra||'')+(o.fields||[]).map(fieldHtml).join('')+'<div class="row-actions"><button type="submit" class="btn primary">'+(o.submit||'Kaydet')+'</button>'+(o.onDelete?'<button type="button" class="btn danger" data-act="sheetDelete">Sil</button>':'')+'<button type="button" class="btn" data-act="closeSheet">Vazgeç</button></div></form>';
  sheet.hidden=false;
  var form=$('#sheetForm');
  var syncIf=function(){form.querySelectorAll('[data-if]').forEach(function(w){var c=form.querySelector('#f_'+w.dataset.if);w.hidden=!c||w.dataset.eq.split('|').indexOf(c.value)<0})};
  form.addEventListener('change',syncIf); syncIf();
  var ageSync=function(){var bd=form.querySelector('#f_birth');if(!bd)return;form.querySelectorAll('option[data-b]').forEach(function(o){var bad=!!(bd.value&&o.dataset.b&&o.dataset.b>=bd.value);o.disabled=bad;o.hidden=bad;if(bad&&o.selected)o.parentNode.value=''})};
  form.addEventListener('change',ageSync);form.addEventListener('input',ageSync);ageSync();
  form.onsubmit=async function(e){
    e.preventDefault();
    var v={};
    (o.fields||[]).forEach(function(f){
      var raw=form.querySelector('#f_'+f.name).value;
      v[f.name]=f.type==='number'?num(raw):raw.trim();
    });
    var miss=(o.fields||[]).find(function(f){return f.required&&(v[f.name]==null||v[f.name]==='')});
    if(miss){toast(miss.label+' gerekli');return}
    try{await o.onSubmit(v);closeSheet()}catch(err){toast(errText(err))}
  };
}
var animalOpts=function(fn,keep){return state.animals.filter(function(x){return (active(x)||x.id===keep)&&(!fn||fn(x))}).sort(byName).map(function(a){return {v:a.id,l:aLbl(a),b:a.birth||''}})};
var pick=function(extra){return [{v:'',l:'Seçin'}].concat(extra||[]).concat([])};

function formAnimal(id){
  var ex=id?byId(id):null;
  openSheet({title:ex?'Hayvanı düzenle':'Hayvan ekle',fields:[
    {name:'tag',label:'Küpe no (henüz yoksa boş bırak)',value:ex&&ex.tag,ph:'TR 34 0123 4567'},
    {name:'name',label:'İsim',value:ex&&ex.name},
    {name:'status',label:'Durum',type:'select',options:STATUSES,value:(ex&&ex.status)||'Sağmal'},
    {name:'sex',label:'Cinsiyet',type:'select',options:['Dişi','Erkek'],value:(ex&&ex.sex)||'Dişi',showIf:['status','Buzağı']},
    {name:'birth',label:'Doğum tarihi',type:'date',value:ex&&ex.birth},
    {name:'calved',label:'Son buzağılama tarihi (biliyorsan)',type:'date',value:ex&&ex.calved,showIf:['status','Sağmal|Kuru']},

function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
async function shrink(src,max,q){
  var i=await loadImg(src), r=Math.min(1,max/Math.max(i.width,i.height)), c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(i.width*r)); c.height=Math.max(1,Math.round(i.height*r));
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
async function fileToData(file){
  var url=URL.createObjectURL(file);
  try{
    var q=.74,out=await shrink(url,720,q);
    while(out.length>170000&&q>.36){q-=.1;out=await shrink(url,720,q)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}
