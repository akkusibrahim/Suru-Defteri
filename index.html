:root{

}
@media (prefers-color-scheme: dark){

    --bg:#101613; --surface:#18201C; --surface2:#212B26; --fg:#E6EEE9; --muted:#9AAAA1; --line:#2B3731;
    --accent:#5CC49E; --accent-fg:#06241A; --accent-soft:#1F3A30;
    --warn:#F0B44C; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#40201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201C; --surface2:#212B26; --fg:#E6EEE9; --muted:#9AAAA1; --line:#2B3731;
  --accent:#5CC49E; --accent-fg:#06241A; --accent-soft:#1F3A30;
  --warn:#F0B44C; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#40201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{

  padding-block:8px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:720px;margin:0 auto}

.dhead{display:flex;gap:14px;align-items:center}

function age(b){
  if(!b) return '';
  var t=today(), m=(+t.slice(0,4)-+b.slice(0,4))*12+(+t.slice(5,7)-+b.slice(5,7));
  if(+t.slice(8)<+b.slice(8)) m--;
  if(m<0) return '';
  if(m<1) return diff(t,b)+' günlük';
  var y=Math.floor(m/12), r=m%12;
  return ((y?y+' yaş ':'')+(r?r+' ay':'')).trim();
}
function toast(msg){

function errText(e){
  var c=e&&e.code;
  if(c==='quota_exceeded') return 'Depolama dolu. Eski kayıtları silmeden yenisi eklenemez.';
  if(c==='resource_exhausted') return 'Çok hızlı işlem yapıldı, birkaç saniye bekleyip tekrar deneyin.';
  if(c==='invalid_argument') return 'Bu kayıt kaydedilemedi. Bu sayfayı yalnızca sahibi değiştirebilir.';
  return (e&&e.message)||'İşlem yapılamadı.';
}

async function rawSet(col,id,body){
  if(db){await db.collection(col).doc(id).set(body)}
  else{var arr=state[col]||(state[col]=[]),o=Object.assign({id:id},body),i=arr.findIndex(function(x){return x.id===id});if(i>=0)arr[i]=o;else arr.push(o)}
}
async function put(col,obj){
  var id=obj.id||uid(), body=Object.assign({},obj); delete body.id;
  await rawSet(col,id,body);
  if(!db){lsSave();render(true)}
  return id;
}
async function del(col,id){
  if(db){await db.collection(col).doc(id).delete()}
  else{state[col]=state[col].filter(function(x){return x.id!==id});lsSave();render(true)}
}
var queues={};
function enq(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(function(e){toast(errText(e))});return queues[key]}

function startSync(){
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(s){
      state[c]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      got[c]=true; if(!s.metadata.fromCache) synced[c]=true;
      if(Object.keys(got).length===COLS.length) loading=false;
      if(Object.keys(synced).length===COLS.length) staleNote=false;
      render();
    },function(e){loading=false;toast(errText(e));render()});
  });
  setTimeout(function(){
    if(Object.keys(synced).length<COLS.length){loading=false;staleNote=true;render()}
  },10000);
}
function watchPhotos(id){
  if(photoFor===id) return;
  if(photoUnsub){photoUnsub();photoUnsub=null}
  photoFor=id;
  if(!db||!id){if(db)state.photos=[];return}
  photoUnsub=db.collection('photos').where('animalId','==',id).onSnapshot(function(s){
    state.photos=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
    render();
  },function(){});
}

/* ---------- hesaplar ---------- */
function idx(){
  MI=new Map(); DT=new Map();
  state.milk.forEach(function(m){
    MI.set(m.id,m);
    DT.set(m.date,(DT.get(m.date)||0)+(m.am||0)+(m.pm||0));
  });
}
function series(days,aid){
  var t=today(),out=[];
  for(var i=days-1;i>=0;i--){
    var d=addDays(t,-i),v=null;
    if(aid){var m=MI.get(aid+'_'+d);if(m)v=(m.am||0)+(m.pm||0)}
    else if(DT.has(d)) v=DT.get(d);
    out.push({d:d,v:v});
  }
  return out;
}
function avgOf(ser){var v=ser.filter(function(x){return x.v!=null});return v.length?sum(v,function(x){return x.v})/v.length:null}
function lastBirth(id){
  var d=state.births.filter(function(b){return b.animalId===id&&b.outcome!=='iptal'}).map(function(b){return b.date});
  var a=byId(id); if(a&&a.calved) d.push(a.calved);
  d.sort(); return d.length?d[d.length-1]:null;
}
function preg(a){
  if(a.exitDate||!canBreed(a)) return null;
  var lb=lastBirth(a.id);
  var l=state.ins.filter(function(i){return i.animalId===a.id&&(!lb||i.date>lb)}).sort(function(x,y){return y.date.localeCompare(x.date)});
  var i=l[0]; if(!i||i.result==='bos') return null;
  var g=(a.gest>0)?a.gest:GEST, t=today(), exp=addDays(i.date,g);
  return {ins:i,gest:g,day:diff(t,i.date),exp:exp,left:diff(exp,t),dry:addDays(exp,-DRY),check:addDays(i.date,30),heat:addDays(i.date,CYCLE),confirmed:i.result==='gebe'};
}
function lastHeat(a){
  var lb=lastBirth(a.id), l=state.heats.filter(function(h){return h.animalId===a.id&&(!lb||h.date>lb)}).map(function(h){return h.date}).sort();
  return l.length?l[l.length-1]:null;
}
/* Açık (gebe olmayan) hayvan için bir sonraki beklenen kızgınlık: son kızgınlık ya da son tohumlamadan 21 gün sonra */
function nextHeat(a){
  if(a.exitDate||!canBreed(a)||preg(a)) return null;
  var lb=lastBirth(a.id), base=lastHeat(a);
  state.ins.forEach(function(i){if(i.animalId===a.id&&(!lb||i.date>lb)&&(!base||i.date>base))base=i.date});
  return base?addDays(base,CYCLE):null;
}
function withdrawal(a,on){
  if(a.exitDate&&(!on||on>a.exitDate)) return null;
  var t=on||today(),best=null;
  state.health.forEach(function(h){
    if(h.animalId!==a.id||!(h.wd>0)||h.date>t) return;
    var until=addDays(h.date,h.wd);
    if(until>=t&&(!best||until>best.until)) best={until:until,left:diff(until,t),what:h.note||h.type};
  });
  return best;
}

var norm=function(s){return String(s||'').trim().toLocaleLowerCase('tr')};
var hash=function(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h).toString(36)};
function settings(){var s=state.meta.find(function(x){return x.id==='settings'});return {targetDays:(s&&s.targetDays)||30}}
function rationFor(a){
  var own=state.rations.filter(function(r){return r.scope==='animal'&&r.key===a.id});
  if(own.length) return {own:true,items:own};
  return {own:false,items:state.rations.filter(function(r){return r.scope==='status'&&r.key===a.status})};
}
function itemNeed(x,L){
  var tot=(x.kg||0)+(x.perL||0)*L, mx=(x.mix||[]).filter(function(c){return c&&c.item&&c.pct>0}), s=sum(mx,function(c){return c.pct});
  if(mx.length&&s>0) return {item:x.item,kg:tot,mix:true,parts:mx.map(function(c){return {item:c.item,kg:tot*c.pct/s,pct:Math.round(c.pct/s*100)}})};
  return {item:x.item,kg:tot,mix:false,parts:[{item:x.item,kg:tot}]};
}
function animalNeedItems(a){var r=rationFor(a), L=avgOf(series(7,a.id))||0;return r.items.map(function(x){return itemNeed(x,L)})}
function animalNeed(a){
  var out=[];animalNeedItems(a).forEach(function(n){n.parts.forEach(function(p){out.push({item:p.item,kg:p.kg})})});
  return out;
}
function herdNeed(){
  var m={};
  state.animals.filter(active).forEach(function(a){
    animalNeed(a).forEach(function(x){var k=norm(x.item);(m[k]||(m[k]={item:x.item,kg:0})).kg+=x.kg});
  });
  return m;
}
function lastPrice(item){
  var k=norm(item), c=state.stock.concat(state.feed).filter(function(x){return norm(x.item)===k&&x.price}).sort(function(a,b){return b.date.localeCompare(a.date)});
  return c.length?c[0].price:null;
}
function stockTable(){
  var need=herdNeed(), m={}, first={};
  Object.keys(need).forEach(function(k){m[k]={item:need[k].item,need:need[k].kg,stock:0}});
  state.stock.forEach(function(x){
    var k=norm(x.item); (m[k]||(m[k]={item:x.item,need:0,stock:0})).stock+=x.kg||0;
    if(!first[k]||x.date<first[k]) first[k]=x.date;
  });
  state.feed.forEach(function(x){var k=norm(x.item);if(m[k]&&first[k]&&x.date>=first[k])m[k].stock-=x.kg||0});

function buildEvents(){

        ev.push({d:p.heat,a:a,kind:'heat',title:'Tekrar kızgınlık gözle'});
      }

    }
    if(active(a)&&a.status==='Buzağı'&&a.birth) ev.push({d:addDays(a.birth,180),a:a,kind:'grow',title:'Buzağı 6 aylık oldu, durumunu güncelle'});

    var nh=nextHeat(a);
    if(nh) ev.push({d:nh,a:a,kind:'heat2',title:'Kızgınlık beklenen gün'});
    var lb2=lastBirth(a.id);
    if(active(a)&&a.status==='Sağmal'&&!p&&lb2&&!(nh&&diff(nh,t)>=-2)&&!state.ins.some(function(i){return i.animalId===a.id&&i.date>lb2}))
      ev.push({d:addDays(lb2,PPW),a:a,kind:'open',title:'Tohumlama zamanı'});
    if(active(a)) state.health.forEach(function(x){if(x.animalId===a.id&&x.next) ev.push({d:x.next,a:a,kind:'health',title:(x.type||'Sağlık')+' hatırlatması',desc:x.note||''})});
  });
  var win={birth:[-20,45],check:[-30,14],heat:[-2,7],heat2:[-2,7],open:[-45,14],grow:[-730,14],dry:[-20,30],wd:[0,30],health:[-7,30]};
  return ev.map(function(e){e.left=diff(e.d,t);return e})
    .filter(function(e){var w=win[e.kind];return e.left>=w[0]&&e.left<=w[1]})

function statusLine(a){
  if(a.exitDate) return {t:(a.exitType||'Sürüden çıktı')+' · '+dshort(a.exitDate),tone:'bad'};
  var t=today(), p=preg(a), w=withdrawal(a);
  if(w) return {t:'Süt verilmez, '+w.left+' gün kaldı',tone:'bad'};
  if(p){
    if(p.confirmed){
      if(p.left<0) return {t:'('+p.day+'. gün) Hesaplanan doğum zamanı '+(-p.left)+' gün geçti, veterinerinize danışın',tone:'bad'};
      if(a.status==='Sağmal'&&diff(p.dry,t)<=0) return {t:'Kuruya çıkarma zamanı geldi',tone:'warn'};
      if(p.left<=14) return {t:'('+p.day+'. gün) Doğum yaklaşıyor: '+mdur(p.left)+' kaldı',tone:'warn'};
      return {t:'Doğuma kalan tahmini süre: '+mdur(p.left),tone:'ok'};
    }
    if(p.day>=30) return {t:'('+p.day+'. gün) Gebelik kontrolü yapılabilir',tone:'warn'};
    var hd=diff(p.heat,t);
    if(hd>=-2&&hd<=3) return {t:'Kızgınlık belirtilerini kontrol edin',tone:'warn'};
    return {t:'Tohumlandı · '+p.day+'. gün',tone:''};
  }
  var nh=nextHeat(a);
  if(nh&&Math.abs(diff(nh,t))<=2) return {t:'Kızgınlık bekleniyor ('+dshort(nh)+')',tone:'warn'};
  var lb=lastBirth(a.id);
  if(a.status==='Sağmal'&&lb&&diff(t,lb)>=PPW&&!state.ins.some(function(i){return i.animalId===a.id&&i.date>lb}))
    return {t:'Doğumdan '+diff(t,lb)+' gün geçti, tohumlanmadı',tone:'warn'};
  if(a.status==='Buzağı'&&a.birth&&diff(t,a.birth)>=180) return {t:'6 aylık oldu, durumunu Düve ya da Tosun yap',tone:'warn'};
  return null;
}

 ['1.6','Tema seçimi (Otomatik, Açık, Koyu). Taze (Yeni doğuran) ve diğer simgeler açıklandı. Dana 6 aylık olunca hatırlatma. Duruma göre inek başı simgeleri.'],
 ['1.5','Yanlış girilen kayıtlar silinebilir. Yedekten geri yükleme kayıtları birleştirir, mevcut kayıtlar kaybolmaz.']
];

var GUIDE=[{"t":"1. Uygulamayı açmak ve ekranı tanımak","lead":"Uygulama 5 bölümden oluşur. Hepsi ekranın en altındaki menüde durur. İstediğin bölüme parmağınla dokun.","p":["<b>Bugün</b>: Ana sayfa. Bugün ve yakında yapılacak işleri gösterir. Üstteki büyük düğmelerle hızlı kayıt girersin.","<b>Hayvanlar</b>: Bütün hayvanların listesi. Bir hayvana dokununca kendi sayfası açılır.","<b>Süt</b>: Her gün sabah ve akşam sağılan sütü yazarsın.","<b>Yem</b>: Hangi hayvana ne kadar yem verileceği ve depodaki yem miktarı.","<b>Daha Fazla</b>: Rapor, gelir ve gider, yedek, tema ve bu kılavuz."],"tip":"Kayıt yaparken ekranın altından bir pencere açılır. Doldurup <b>Kaydet</b>'e dokunursun. Vazgeçersen <b>Vazgeç</b>'e dokun, hiçbir şey kaydedilmez. Kılavuzdaki hayvan adları (Sarıkız, Benekli...) örnektir.","img":[["bugun","Bugün sayfası"]]},{"t":"2. Yeni hayvan eklemek","lead":"Sürüdeki her hayvanı bir kez ekleyeceksin. Sonra bütün kayıtlar o hayvana bağlanır.","s":["Bugün sayfasında <b>Hayvan ekle</b>'ye dokun. (Hayvanlar sayfasında da aynı düğme var.)","<b>Küpe no</b> yaz. Hayvanın kulağındaki numaradır. Henüz küpe takılmadıysa boş bırak, sonra eklersin.","<b>İsim</b> yaz. Küpe yoksa isim yazman gerekir.","<b>Durum</b> seç: Sağmal, Kuru, Düve, Buzağı, Tosun veya Boğa.","Doğum tarihini yaz. Annesini ve babasını (güve) listeden seç. Bilmiyorsan boş bırak.","<b>Irk</b> kutusuna dokunup listeden seç. Listede yoksa en alttaki <b>Diğer</b>'i seç ve ırkın adını yaz. Bir sonraki hayvanda bu ırk listede görünür.","<b>Kaydet</b>'e dokun."],"p":["<b>Sağmal</b> süt veren inek. <b>Kuru</b> sütü kesilmiş, doğuma hazırlanan inek. <b>Düve</b> hiç doğurmamış genç dişi. <b>Buzağı</b> yavru. <b>Tosun</b> genç erkek. <b>Boğa</b> yetişkin erkek ve baba olarak seçilebilir."],"tip":"Anne ve baba seçerken yaşı küçük olan, büyüğün ebeveyni olarak seçilemez. Doğum tarihini yazınca uygun olmayan hayvanlar listeden kalkar. Yanlış yazarsan uygulama uyarır.","img":[["ekle","Hayvan ekle penceresi, ırk için Diğer seçilmiş"]]},{"t":"3. Hayvan listesi ve simgeler","lead":"Hayvanlar sayfasında hepsi alt alta durur. Her hayvanın yanındaki küçük simgeler durumunu bir bakışta söyler.","p":["Üstteki düğmelerle listeyi süzebilirsin: Hepsi, İnek, Sağmal, Kuru, Gebe, Düve, Buzağı, Boğa, Çıkanlar. Örneğin <b>Gebe</b>'ye dokunursan sadece gebeler kalır.","Fotoğrafı olmayan hayvanda durumuna göre bir inek başı görünür. Sağmal inek ile inek aynı başı kullanır. Süt bidonu (güğüm) ise yalnızca süt işleri içindir.","Sayfanın altındaki <b>Simgeler ne demek?</b> yazısına dokunursan hepsinin açıklaması açılır. Örnek: <b>Taze (Yeni doğuran)</b> son 21 gün içinde doğum yapmış sağmal inek demektir. <b>Süt verilmez</b> simgesi ilaç verildiğini ve süt tanka ya da satışa verilmeyeceğini gösterir."],"img":[["liste","Hayvan listesi"],["simgeler","Simgelerin açıklaması"]]},{"t":"4. Tohumlama kaydı ve doğum sayacı","lead":"İneği tohumladığında kaydet. Uygulama doğum gününü kendisi hesaplar ve geriye doğru sayar.","s":["Bugün sayfasında <b>Tohumlama</b>'ya dokun.","<b>Dişi hayvan</b>: ineği listeden seç.","<b>Tohumlama tarihi</b>: bugün seçili gelir. Başka güne yapıldıysa değiştir.","<b>Güve (baba)</b>: boğan sürüdeyse listeden seç. Pipet kullandıysan \"Sürüde yok\" seçip pipet kodunu yaz.","<b>Kaydet</b>'e dokun."],"p":["<b>Gebelik çıkınca:</b> İneğin sayfasını aç, <b>Gebe çıktı</b> düğmesine dokun. Gebe değilse <b>Boş çıktı</b>'na dokun.","Sayfada büyük bir sayı görünür. Bu gebeliğin kaçıncı günü olduğudur. Yanında \"5 ay 29 gün kaldı\" gibi doğuma kalan süre yazar. Süre ay ve gün olarak gösterilir. Bir ayı geçmiyorsa sadece gün görürsün. Bugün sayfasındaki yaklaşan olaylarda da aynı biçim vardır."],"tip":"Gebelik 280 gün sayılır. Tohumlamadan 30 gün sonra \"Gebelik kontrolü\", doğuma 60 gün kala \"Kuruya çıkar\" uyarısı Bugün sayfasına gelir. Yanlış kayıt girdiysen hayvan sayfasındaki Geçmiş listesinde kayda dokun, düzelt ya da sil.","img":[["tohum","Tohumlama penceresi"],["gebe","Gebe ineğin sayfası"]]},{"t":"5. Doğum kaydı","lead":"İnek doğurunca kaydet. Buzağı da aynı ekrandan deftere eklenir.","s":["Bugün sayfasında <b>Doğum</b>'a dokun ya da ineğin sayfasında <b>Doğum kaydet</b>'e bas.","İneği, doğum tarihini ve sonucu (diri doğdu ya da ölü) seç.","Buzağının küpe no ve ismini yaz, dişi mi erkek mi olduğunu seç.","<b>Kaydet</b>'e dokun. Buzağı Hayvanlar listesine kendiliğinden eklenir, annesi de bağlanır."],"tip":"Doğumdan sonra inek <b>Sağmal</b> olur ve 21 gün boyunca <b>Taze</b> simgesi görürsün. Buzağı 6 aylık olunca Bugün sayfasında hatırlatma çıkar."},{"t":"6. Kızgınlık kaydı","lead":"İnek kızgınlık gösterdiğinde kaydedersen sonraki kızgınlığı uygulama hatırlatır.","s":["Bugün sayfasında <b>Kızgınlık</b>'a dokun.","İneği ve tarihi seç.","<b>Kaydet</b>'e dokun."],"p":["Kızgınlık döngüsü 21 gün sayılır. 21 gün sonrası için Bugün sayfasına hatırlatma düşer. Tohumlamayı unutmamak için işe yarar."]},{"t":"7. Günlük süt girişi","lead":"Her gün sabah ve akşam sağılan litreyi yazarsın. Uygulama ortalamayı ve toplamı kendisi bulur.","s":["Alttaki menüden <b>Süt</b>'e dokun.","Üstten günü seç (bugün hazır gelir).","Her ineğin satırına sabah ve akşam litresini yaz.","Yazdıkça kaydedilir, ayrıca bir düğmeye basman gerekmez."],"tip":"Yanlış yazdıysan aynı satıra gidip düzelt. Silmek için kutuyu boş bırak."},{"t":"8. Sağlık kaydı ve süt bekleme süresi","lead":"Hastalık, tedavi, aşı gibi şeyleri kaydedersin. İlaç verildiyse sütün ne zamana kadar verilmeyeceğini uygulama hesaplar.","s":["Hayvanın sayfasında <b>Geçmiş</b> bölümündeki <b>Sağlık ekle</b> düğmesine dokun (ya da Bugün sayfasında <b>Sağlık kaydı</b>).","Türü seç: Hastalık, Tedavi, Aşı, Muayene gibi.","Notu yaz (örnek: meme iltihabı, antibiyotik).","İlacın <b>süt bekleme süresini</b> gün olarak yaz. İlacın kutusunda yazar.","<b>Kaydet</b>'e dokun."],"tip":"Bekleme süresi bitene kadar hayvanın yanında <b>Süt verilmez</b> simgesi durur. O günlerin sütünü tanka ya da satışa karıştırma."},{"t":"9. Yem: tek yem, karma yem ve stok","lead":"Ne kadar yem vereceğini girersin. Uygulama toplam ihtiyacı ve depoda kaç gün yettiğini hesaplar.","s":["Alttaki menüden <b>Yem</b>'e dokun.","Aşağıdaki <b>Gruplara göre rasyon</b> kutularından ilgili grubun (örneğin Sağmal) <b>Kalem ekle</b> düğmesine dokun.","<b>Veriliş şekli</b>: <b>Tek yem</b> ya da <b>Karma yem</b> seç.","Tek yemde yem cinsini ve baş başına günlük kg'ı yaz. Örnek: Saman, 6 kg.","Karma yemde karışımın adını (örnek: Süt yemi) ve toplam kg'ı yaz. Sonra karışımdaki yemleri ve paylarını gir. Örnek: Arpa 50, Kepek 30, Mısır 20.","<b>Kaydet</b>'e dokun."],"p":["Örnek: Karma yem günde 10 kg ise, 50/30/20 paylarıyla 5 kg arpa, 3 kg kepek, 2 kg mısır çıkar. Stoktan her yemin payı düşülür.","Tek yem ile karma yemi aynı grupta birlikte kullanabilirsin. Örneğin bir kalem Saman (tek), bir kalem Süt yemi (karma) olabilir.","<b>Sağmal ineklerde \"süt başına ek\"</b> alanına litre başına ek yem yazarsan, son 7 günün süt ortalamasına göre kesif yem kendiliğinden ayarlanır.","<b>Stok</b> sekmesinden depoya yem girersin (kaç kg aldın, kaç liradan). Uygulama kaç gün yeteceğini söyler.","Yemlediğin zaman Rasyon sayfasındaki <b>Bugünün yemlemesini kaydet</b> düğmesine bas. Stoktan o kadar düşer."],"img":[["karma","Karma yem eklerken açılan alanlar"],["yem","Yem sayfası"]]},{"t":"10. Hayvan satıldı ya da öldü","lead":"Sürüden çıkan hayvanı silme, çıkış olarak kaydet. Geçmişi kaybolmaz.","s":["Hayvanın sayfasında <b>Sürüden çıkar</b>'a dokun.","<b>Satıldı</b> ya da <b>Öldü</b> seç, tarihini yaz.","Satıldıysa fiyatı yaz. Gelire kendiliğinden eklenir.","<b>Kaydet</b>'e dokun."],"p":["Çıkan hayvan listeden kalkar. Hayvanlar sayfasındaki <b>Çıkanlar</b> düğmesiyle yine görebilirsin."]},{"t":"11. Hayvanın fotoğrafını eklemek","lead":"Her hayvana bir resim koyabilirsin, listede onu daha kolay tanırsın.","s":["Hayvanın sayfasını aç ve aşağıdaki <b>Fotoğraflar</b> bölümüne in.","<b>Fotoğraf ekle</b>'ye dokun.","Kameradan çek ya da galeriden seç."],"tip":"Fotoğraf yedeğe de girer."},{"t":"12. Daha Fazla: rapor, gelir-gider, yedek, tema","lead":"Bu sayfada sürünün özeti, para hesabı ve ayarlar durur.","p":["<b>Rapor</b>: Üstten <b>Bu ay, Son 3 ay, Son 1 yıl</b> seç. Kaç tohumlama, doğum, hastalık olduğunu ve toplam sütü görürsün.","<b>Gelir / gider</b>: <b>Ekle</b> düğmesiyle süt satışı, yem alımı, veteriner gibi paraları yaz. Farkı (kâr ya da zarar) kendisi gösterir. Hayvan satışı ve yem alımı ayrıca girmene gerek kalmadan hesaba katılır.","<b>Excel</b>: CSV dosyası indirirsin, Excel ile açılır.","<b>Tema</b>: Otomatik, Açık ya da Koyu seç. Seçimin bu telefonda hatırlanır.","<b>Yedek indir</b>: Bütün kayıtları ve fotoğrafları tek dosya yapar. Telefon değiştirirsen ya da bir şey kaybolursa <b>Yedekten yükle</b> ile geri getirirsin. Geri yüklerken mevcut kayıtların silinmez, yedekteki hayvanlar eklenir.","Yedek <b>yalnızca kayıtları</b> taşır, uygulamanın sürümünü taşımaz. Yeni özellikler için uygulama sayfasını yenilemen yeter."],"tip":"Haftada bir yedek almak iyi alışkanlıktır. Yedek dosyasını WhatsApp ya da e-posta ile kendine de gönderebilirsin.","img":[["fazla","Daha Fazla sayfası"]]},{"t":"13. Hızlı özet: ne yapmak istiyorsun?","lead":"Aradığın işi bul, yanındaki yola git.","p":["Yeni hayvan: <b>Bugün > Hayvan ekle</b>","İnek tohumlandı: <b>Bugün > Tohumlama</b>","İnek gebe çıktı: <b>İneğin sayfası > Gebe çıktı</b>","İnek doğurdu: <b>Bugün > Doğum</b>","İnek kızgın: <b>Bugün > Kızgınlık</b>","Süt yazmak: <b>Süt</b> sekmesi","İlaç verildi: <b>İneğin sayfası > Geçmiş > Sağlık ekle</b>","Yem miktarı ve karma yem: <b>Yem</b> sekmesi","Hayvan satıldı ya da öldü: <b>İneğin sayfası > Sürüden çıkar</b>","Gelir gider: <b>Daha Fazla</b> sayfası","Yedek, tema: <b>Daha Fazla</b> sayfasının altı"]}];
function viewNew(){
  return '<div class="card gd"><h3>Neler yeni?</h3><p class="muted" style="margin:0 0 6px">Uygulama sürümü '+APP_VER+'</p>'+CHANGES.map(function(c){return '<details'+(c[0]===APP_VER?' open':'')+'><summary>Sürüm '+c[0]+'</summary><p>'+esc(c[1])+'</p></details>'}).join('')+'</div>';
}
function viewGuide(){
  return '<div class="card gd"><h3>Kullanım kılavuzu</h3><p class="muted" style="margin:0 0 6px">Başlığa dokun, açılsın. Her işlem adım adım anlatılıyor.</p>'+GUIDE.map(function(s){
    return '<details><summary>'+esc(s.t)+'</summary>'+(s.lead?'<p><i>'+esc(s.lead)+'</i></p>':'')+(s.s?'<ol>'+s.s.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>':'')+(s.p||[]).map(function(x){return '<p>'+x+'</p>'}).join('')+(s.tip?'<div class="tip"><b>İpucu</b> '+s.tip+'</div>':'')+(s.img||[]).map(function(m){return '<figure><img loading="lazy" alt="'+esc(m[1])+'" src="'+GIMG[m[0]]+'"><figcaption>'+esc(m[1])+'</figcaption></figure>'}).join('')+'</details>'}).join('')+'</div>';
}
function viewBackup(){
  var n=COLS.map(function(c){return state[c].length}).reduce(function(a,b){return a+b},0);
  var th=getTheme();
  var themeCard='<div class="card"><h3>Görünüm</h3><p class="muted" style="margin-top:0">Tema seçimi bu cihazda hatırlanır.</p><div class="chips" style="margin:0">'+[['auto','Otomatik'],['light','Açık'],['dark','Koyu']].map(function(t){return '<button data-act="setTheme" data-v="'+t[0]+'" aria-pressed="'+(th===t[0])+'">'+t[1]+'</button>'}).join('')+'</div></div>';
  var wipeCard=localMode?'<div class="card"><h3>Tüm kayıtları sil</h3><p class="muted" style="margin-top:0">Bu cihazdaki bütün hayvan, süt, yem ve diğer kayıtları siler ve boş bir defterle başlarsın. Geri alınamaz, istersen önce yedek indir.</p><div class="row-actions"><button class="btn danger" data-act="wipeAll">Hepsini sil</button></div></div>':'';
  return themeCard+'<div class="card"><h3>Yedek</h3><p class="muted" style="margin-top:0">Tüm kayıtları ve fotoğrafları tek dosyada indirir. Telefon değiştirirsen ya da bir şey silinirse bu dosyadan geri yükleyebilirsin.</p><div class="row-actions"><button class="btn primary" data-act="backup"'+((dlCap||STANDALONE)?'':' disabled')+'>Yedek indir</button><button class="btn" data-act="restore">Yedekten yükle</button></div>'+((dlCap||STANDALONE)?'':'<p class="muted">Bu görünümde dosya indirme kapalı. Sayfayı claude.ai üzerinden aç.</p>')+'</div>'+
  wipeCard+'<div class="card"><h3>Saklama</h3><p class="muted" style="margin:0">'+(localMode?'Kayıtlar yalnızca bu cihazdaki tarayıcıda tutuluyor, tarayıcı verisi silinirse kaybolur. Düzenli yedek al.':'Kayıtlar bu sayfanın veri deposunda tutuluyor. Sayfa güncellense bile silinmez.')+' Şu an '+n+' kayıt var. Gebelik süresi varsayılan '+GEST+' gün (hayvan kartından hayvana göre değiştirilebilir), kuruya çıkarma doğumdan '+DRY+' gün önce, kızgınlık döngüsü '+CYCLE+' gün olarak hesaplanır.</p></div>';
}

/* ---------- yönlendirme ve çizim ---------- */
function parseRoute(){
  var h=(location.hash||'').slice(1);
  if(h.indexOf('a-')===0) return {k:'animal',id:h.slice(2)};
  if(h==='yedek') h='rapor';
  return {k:['hayvanlar','sut','yem','rapor'].indexOf(h)>=0?h:'bugun'};
}
function isEditing(){var el=document.activeElement;return !!(el&&el.closest&&el.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))}
function render(force){
  if(!force&&isEditing()){dirty=true;return}
  dirty=false; idx();
  var r=parseRoute();
  watchPhotos(r.k==='animal'?r.id:null);
  document.querySelectorAll('#nav a').forEach(function(a){
    var on=a.dataset.r===(r.k==='animal'?'hayvanlar':r.k);
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
  var n=new Date();
  $('#today').textContent=DAYN[n.getDay()]+', '+n.getDate()+' '+MONF[n.getMonth()]+' '+n.getFullYear();
  var b='';
  if(staleNote) b+='<div class="banner">Kayıtlar henüz sunucudan doğrulanamadı. Gördüklerin eski olabilir.</div>';
  if(localMode&&!STANDALONE) b+='<div class="banner">Kalıcı depo bu görünümde kapalı. Kayıtlar yalnızca bu tarayıcıda saklanıyor.</div>';
  var body;
  if(loading) body='<p class="muted" style="margin-top:24px">Kayıtlar yükleniyor…</p>';
  else if(r.k==='animal') body=viewAnimal(r.id);
  else body={bugun:viewToday,hayvanlar:viewAnimals,sut:viewMilk,yem:viewFeed,rapor:viewReport}[r.k]();
  view.innerHTML=b+body;
}

function fieldHtml(f){
  var id='f_'+f.name,val=f.value==null?'':f.value,c;
  if(f.type==='select'){
    c='<select id="'+id+'">'+f.options.map(function(o){o=typeof o==='string'?{v:o,l:o}:o;return '<option value="'+esc(o.v)+'"'+(o.b?' data-b="'+esc(o.b)+'"':'')+(String(o.v)===String(val)?' selected':'')+'>'+esc(o.l)+'</option>'}).join('')+'</select>';
  }else if(f.type==='textarea'){
    c='<textarea id="'+id+'" rows="2">'+esc(val)+'</textarea>';
  }else{
    c='<input id="'+id+'" type="'+(f.type==='number'?'text':(f.type||'text'))+'"'+(f.type==='number'?' inputmode="decimal"':'')+' value="'+esc(val)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+' autocomplete="off">';

function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
async function shrink(src,max,q){
  var i=await loadImg(src), r=Math.min(1,max/Math.max(i.width,i.height)), c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(i.width*r)); c.height=Math.max(1,Math.round(i.height*r));
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
async function fileToData(file){
  var url=URL.createObjectURL(file);
  try{
    var q=.74,out=await shrink(url,720,q);
    while(out.length>170000&&q>.36){q-=.1;out=await shrink(url,720,q)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}

document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]'); if(!el) return;
  var fn=ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el.dataset.id,el.dataset.v,el)).catch(function(err){toast(errText(err))});
});

      dlCap=await window.claude.use('downloads');
    }

  if(db){startSync()}
  else{
    localMode=true;
    var s=lsLoad();
    COLS.concat(['photos']).forEach(function(c){state[c]=s[c]||[]});

})();
